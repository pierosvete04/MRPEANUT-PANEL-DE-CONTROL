<!DOCTYPE html>

<head>

</head>
<body>
<!-- Íconos (trazos estilo Lucide) -->

  <defs>
    <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
    <symbol id="i-pedidos" viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
    <symbol id="i-clientes" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></symbol>
    <symbol id="i-analisis" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-club" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m9 14.5-1.5 7L12 19l4.5 2.5-1.5-7"/><path d="m12 6 .9 1.9 2 .3-1.5 1.4.4 2L12 10.7l-1.8.9.4-2L9.1 8.2l2-.3z"/></symbol>
    <symbol id="i-productos" viewBox="0 0 24 24"><path d="M8 3h8v3H8z"/><path d="M7 6h10l1 3v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9z"/><path d="M6 12h12"/></symbol>

    <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-mas" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></symbol>
    <symbol id="i-regalo" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
    <symbol id="i-camara" viewBox="0 0 24 24"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-estrella" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></symbol>
    <symbol id="i-amigos" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></symbol>
    <symbol id="i-pausa" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></symbol>
    <symbol id="i-corona" viewBox="0 0 24 24"><path d="m3 7 4.5 4L12 4l4.5 7L21 7l-2 12H5z"/></symbol>
    <symbol id="i-dinero" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></symbol>
    <symbol id="i-calendario" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
    <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-camion" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
    <symbol id="i-mas-circ" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-hoja" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19 13 11"/></symbol>
    <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-descargar" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
    <symbol id="i-campana" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
    <symbol id="i-basura" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V4M9.5 13h.01M14.5 13h.01M9 16.5h6M3 13v2M21 13v2"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M3.5 20.5 5 16a8.5 8.5 0 1 1 3.3 3.2z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a4 4 0 0 1-2.3-2.3l.8-1-1-2z"/></symbol>

</svg>

<header class="top">
  <div class="top-fila">
    <a href="#" class="marca-link" onclick="ir('inicio');return false" aria-label="Ir al inicio">
      <img src="img/logo.png" alt="Mr. Peanut" class="logo">
      <span class="marca"><b>Panel de control</b><span>Pedidos, clientes y Club</span></span>
    </a>
    <div class="der">
      <button class="pill oculto" id="btn-instalar" title="Instalar el panel en esta computadora"><svg class="ic"><use href="#i-descargar"/></svg><span>Instalar</span></button>
      <div class="notif-caja" id="notif-caja">
        <button class="pill campana" id="btn-notif" aria-label="Notificaciones"><svg class="ic"><use href="#i-campana"/></svg><b class="badge oculto" id="notif-n">0</b></button>
        <div class="panel-notif" id="panel-notif" role="dialog" aria-label="Notificaciones"></div>
      </div>
      <button class="pill off" id="estado-sync" title="Estado de la sincronización con Supabase"><i></i><span>Solo local</span></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <div class="tabs-lista" id="tabs-lista">
      <button data-vista="inicio" class="activo"><svg class="ic"><use href="#i-inicio"/></svg><span>Inicio</span></button>
      <button data-vista="pedidos"><svg class="ic"><use href="#i-pedidos"/></svg><span>Pedidos</span></button>
      <button data-vista="clientes"><svg class="ic"><use href="#i-clientes"/></svg><span>Clientes</span></button>
      <button data-vista="historial"><svg class="ic"><use href="#i-reloj"/></svg><span>Historial</span></button>
      <button data-vista="analisis"><svg class="ic"><use href="#i-analisis"/></svg><span>Análisis de clientes</span></button>
      <button data-vista="club"><svg class="ic"><use href="#i-club"/></svg><span>Club Mr. Peanut</span></button>
      <button data-vista="productos"><svg class="ic"><use href="#i-productos"/></svg><span>Productos y promociones</span></button>
      <button data-vista="inventario"><svg class="ic"><use href="#i-inventario"/></svg><span>Inventario</span></button>
      <button data-vista="ajustes"><svg class="ic"><use href="#i-sync"/></svg><span>Sincronización</span></button>
    </div>
    <div class="tabs-mas oculto" id="tabs-mas">
      <button id="btn-mas" aria-haspopup="true" aria-expanded="false"><svg class="ic"><use href="#i-mas"/></svg><span>Más</span></button>
      <div class="menu-mas" id="menu-mas" role="menu"></div>
    </div>
  </nav>
</header>

<main>
  <section class="vista activa" id="v-inicio"></section>
  <section class="vista" id="v-pedidos"></section>
  <section class="vista" id="v-clientes"></section>
  <section class="vista" id="v-historial"></section>
  <section class="vista" id="v-analisis"></section>
  <section class="vista" id="v-club"></section>
  <section class="vista" id="v-productos"></section>
  <section class="vista" id="v-inventario"></section>
  <section class="vista" id="v-ajustes"></section>
  <section class="vista" id="v-pagina"></section>
</main>

<script src="app.js"></script>
</body>
</html>
